<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Metric33 · live snapshot</title>
<style>
  :root { --bg:#0b0e11; --fg:#d6dde5; --dim:#79838f; --acc:#4ea1ff; --warn:#ffb020; --bad:#ff5d5d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; padding:16px 14px 40px; }
  h1 { font-size:14px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim);
       font-weight:600; margin:0 0 10px; }
  #age { display:inline-block; padding:2px 8px; border-radius:3px; font-size:12px;
         background:#1b2430; color:var(--acc); margin-bottom:12px; }
  #age.warn { background:#2e2410; color:var(--warn); }
  #age.bad  { background:#301616; color:var(--bad); }
  pre { white-space:pre-wrap; word-break:break-word; margin:0 0 14px; }
  .row { border-bottom:1px solid #161d26; padding:3px 0; }
  .row b { color:#fff; font-weight:600; }
  a { color:var(--acc); text-decoration:none; }
  footer { margin-top:16px; color:var(--dim); font-size:12px; }
  button { background:#1b2430; color:var(--fg); border:1px solid #24303d; border-radius:4px;
           padding:6px 12px; font:inherit; cursor:pointer; }
  button:active { background:#24303d; }
</style>
</head>
<body>
<h1>Metric33 · closed-bar snapshot</h1>
<div id="age">loading…</div>
<pre id="out"></pre>
<div><button onclick="load()">refresh</button></div>
<footer>
  <a id="lj" href="metric33_latest.json">metric33_latest.json</a> ·
  <a id="lt" href="metric33_latest.txt">metric33_latest.txt</a>
</footer>
<script>
const out = document.getElementById('out');
const ageEl = document.getElementById('age');
let generated = null;

function paintAge() {
  if (!generated) return;
  const mins = (Date.now() - generated.getTime()) / 60000;
  const h = mins / 60;
  ageEl.textContent = h < 1 ? `${Math.round(mins)} min old`
                            : `${h.toFixed(1)} h old · ${generated.toISOString().slice(0,16)}Z`;
  ageEl.className = h > 6 ? 'bad' : h > 1.5 ? 'warn' : '';
}

async function load() {
  try {
    const r = await fetch('metric33_latest.json?t=' + Date.now(), {cache:'no-store'});
    const d = await r.json();
    generated = new Date(d.generated_at_utc || Date.parse(d.header));
    out.textContent = (d.rows || []).join('\n');
    document.getElementById('lj').href = 'metric33_latest.json?t=' + Date.now();
    document.getElementById('lt').href = 'metric33_latest.txt?t=' + Date.now();
    paintAge();
  } catch (e) {
    out.textContent = 'fetch failed: ' + e.message;
    ageEl.textContent = 'no data'; ageEl.className = 'bad';
  }
}
setInterval(paintAge, 30000);
load();
</script>
</body>
</html>
