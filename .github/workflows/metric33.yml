name: Metric33 — Hourly & On-Demand Live Snapshot

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metric33-snapshot
  cancel-in-progress: false

jobs:
  fetch-metric33:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run offline unit tests
        run: python test_metric33.py

      - name: Fetch 33 live metrics (Text + JSON)
        run: |
          mkdir -p data docs
          python metric33.py | tee data/metric33_latest.txt
          python metric33.py --json > data/metric33_latest.json
          # public copies — served by GitHub Pages from /docs
          cp data/metric33_latest.json docs/metric33_latest.json
          cp data/metric33_latest.txt  docs/metric33_latest.txt
          {
            echo "## Metric33 Live Snapshot"
            echo '```text'
            cat data/metric33_latest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload downloadable snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: metric33-latest-snapshot
          path: |
            data/metric33_latest.txt
            data/metric33_latest.json
          retention-days: 30

      - name: Publish to GitHub Pages (commit back to master)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/metric33_latest.txt data/metric33_latest.json \
                  docs/metric33_latest.txt docs/metric33_latest.json
          if git diff --cached --quiet; then
            echo "no change — nothing to publish"
            exit 0
          fi
          git commit -m "data: metric33 snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
